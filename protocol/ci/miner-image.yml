name: NOET miner image

# Builds the GPU miner image (CUDA engine, VDF binding, pinned model) on an x86
# runner. No GPU is needed to compile. On demand only; pushing is opt-in.
on:
  workflow_dispatch:
    inputs:
      push:
        description: Push to ghcr.io/<owner>/noet-miner after the build succeeds
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: noet-miner-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free disk space (CUDA devel images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pinned sources and miner build context
        run: |
          git lfs version
          python3 protocol/bootstrap.py
          python3 protocol/miner/prepare.py --out /tmp/noet-miner
      - name: Build (fails unless the model matches its pinned SHA-256)
        run: docker build -t noet-miner:ci /tmp/noet-miner
      - name: Smoke test without a GPU
        run: |
          docker run --rm --entrypoint python3 noet-miner:ci /opt/noet/app/noet_miner.py --help
          docker run --rm --entrypoint sh noet-miner:ci -c \
            'test -x /opt/noet/bin/llama-server && ls /opt/noet/licenses && sha256sum /models/qwen3-0.6b-bf16.gguf'
      - name: Push
        if: ${{ inputs.push }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/noet-miner
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag noet-miner:ci "$image:${GITHUB_SHA::12}"
          docker push "$image:${GITHUB_SHA::12}"
          docker inspect --format '{{index .RepoDigests 0}}' "$image:${GITHUB_SHA::12}"
