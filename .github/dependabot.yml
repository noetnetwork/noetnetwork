# Weekly update pull requests for the pinned GitHub Actions and the miner
# image's base. Each one must pass the tests workflow before it is merged;
# nothing merges itself. The miner image takes patch updates only: a new
# CUDA or Python minor or major can break miners on older GPU drivers, and
# the tests workflow does not build the image.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /protocol/miner
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
