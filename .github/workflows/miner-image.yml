name: NOET miner image

# Builds the GPU miner image (CUDA engine, VDF binding, pinned model) on an x86
# runner. No GPU is needed to compile. On demand only; pushing is opt-in.
on:
  workflow_dispatch:
    inputs:
      push:
        description: Push to ghcr.io/<owner>/noet-miner after the build succeeds
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write  # keyless signing of the pushed image (Sigstore)

concurrency:
  group: noet-miner-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free disk space (CUDA devel images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Pinned sources and miner build context
        run: |
          git lfs version
          python3 protocol/bootstrap.py --engines
          python3 protocol/miner/prepare.py --out /tmp/noet-miner
      - name: Build (fails unless the model matches its pinned SHA-256)
        run: docker build -t noet-miner:ci /tmp/noet-miner
      - name: Smoke test without a GPU
        run: |
          docker run --rm noet-miner:ci --help
          # Every shared library the engine needs is in the image; only the GPU driver's
          # libcuda comes from the host at run time.
          docker run --rm --entrypoint sh noet-miner:ci -c \
            'ldd /opt/noet/bin/llama-server | grep "not found" | grep -v libcuda.so; test $? = 1'
          docker run --rm --entrypoint sh noet-miner:ci -c \
            'test -x /opt/noet/bin/llama-server && test -x /opt/noet/start.sh && test -f /opt/noet/engine.tar \
             && python3 -m venv /tmp/venv-check && ls /opt/noet/licenses && sha256sum /models/qwen3-0.6b-bf16.gguf'
      - name: Push
        if: ${{ inputs.push }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/noet-miner
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag noet-miner:ci "$image:${GITHUB_SHA::12}"
          docker push "$image:${GITHUB_SHA::12}"
          docker inspect --format '{{index .RepoDigests 0}}' "$image:${GITHUB_SHA::12}" | tee /tmp/noet-miner-digest
      - name: Cosign
        if: ${{ inputs.push }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        if: ${{ inputs.push }}
        # Anyone can check the image came from this workflow:
        #   cosign verify <image>@sha256:... --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     --certificate-identity-regexp '^https://github.com/<owner>/<repo>/.github/workflows/miner-image.yml@'
        run: cosign sign --yes "$(cat /tmp/noet-miner-digest)"
      - name: SBOM
        if: ${{ inputs.push }}
        # A software bill of materials (SPDX) for the pushed image, attached as a
        # signed attestation: cosign verify-attestation --type spdxjson <image>@sha256:...
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.18.1 \
            "$(cat /tmp/noet-miner-digest)" -o spdx-json > /tmp/noet-miner.spdx.json
          cosign attest --yes --type spdxjson --predicate /tmp/noet-miner.spdx.json "$(cat /tmp/noet-miner-digest)"
