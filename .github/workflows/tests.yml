name: NOET tests

# The protocol unit tests on every push and pull request. CPU only: no GPU,
# no model download, no network beyond the pinned upstream sources.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noet-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pinned upstream sources and patches
        run: python3 protocol/bootstrap.py
      - name: Protocol tests
        env:
          PYTHONPATH: protocol
        run: python3 -m unittest discover -s protocol/tests
